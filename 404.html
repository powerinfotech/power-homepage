<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>페이지를 찾을 수 없습니다 | 파워인포텍</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: #000031;
            color: #FFF;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            text-align: center;
        }
        main { max-width: 420px; }
        img { display: block; width: 200px; margin: 0 auto 40px; }
        .code { margin: 0 0 12px; font-size: 64px; font-weight: 800; letter-spacing: -2px; color: #4D7CFF; }
        h1 { margin: 0 0 12px; font-size: 22px; font-weight: 700; }
        p { margin: 0 0 32px; font-size: 15px; line-height: 1.6; color: rgba(255, 255, 255, .7); }
        a.home {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 999px;
            background: #FFF;
            color: #000031;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }
        a.home:hover, a.home:focus-visible { background: #E8F0FE; }
    </style>
</head>
<body>
    <main>
        <img src="/images/pit_logo_powerinfotec.svg" alt="파워인포텍">
        <p class="code">404</p>
        <h1>페이지를 찾을 수 없습니다</h1>
        <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>홈페이지에서 원하시는 내용을 찾아보세요.</p>
        <a class="home" href="/">홈으로 가기</a>
    </main>
</body>
</html>
